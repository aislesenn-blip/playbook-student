<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Quill.js for Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <!-- KaTeX for Math Equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <script src="env.js"></script>
  <script type="module" src="app.js" defer></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">

  <!-- Navigation Bar -->
  <header id="main-header" class="bg-white/90 backdrop-blur-2xl sticky top-0 z-10 border-b border-slate-200/50 px-4 md:px-8 py-4 flex justify-between items-center hidden shadow-sm transition-all">
    <div class="flex items-center cursor-pointer hover:opacity-80 transition-opacity" onclick="window.location.hash=''">
      <img src="images/playbook-logo.png" alt="Playbook" class="h-8 md:h-10 w-auto mix-blend-multiply" style="object-fit: contain;">
    </div>
    <div class="flex items-center gap-5">
      <div id="header-avatar-container" class="w-10 h-10 bg-slate-100 rounded-full border border-slate-200 overflow-hidden flex items-center justify-center shadow-sm cursor-pointer hover:shadow-md transition-shadow">
        <i data-lucide="user" class="w-5 h-5 text-slate-500"></i>
      </div>
      <button id="btn-logout" class="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors rounded-full">
        <i data-lucide="log-out" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main id="app-container" class="max-w-3xl mx-auto px-4 py-8 pb-32 md:pb-8"></main>

  <!-- Mobile Bottom Navigation (Instagram/TikTok style) -->
  <nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-2xl border-t border-slate-200/50 flex justify-around items-center px-6 py-3 pb-8 z-40 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.05)] hidden">
    <button id="mob-tab-overview" class="flex flex-col items-center gap-1 text-black transition-transform active:scale-95">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="text-[10px] font-bold">Home</span>
    </button>
    <button id="mob-tab-classes" class="flex flex-col items-center gap-1 text-slate-400 hover:text-black transition-all active:scale-95">
      <i data-lucide="book-open" class="w-6 h-6"></i>
      <span class="text-[10px] font-bold">Classes</span>
    </button>
    <div class="relative -top-6">
      <button id="mob-btn-open-join" class="w-14 h-14 bg-black text-white rounded-full flex items-center justify-center shadow-2xl shadow-black/30 border-4 border-white active:scale-95 transition-transform">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </button>
    </div>
    <button id="mob-tab-tasks" class="flex flex-col items-center gap-1 text-slate-400 hover:text-black transition-all active:scale-95">
      <i data-lucide="clock" class="w-6 h-6"></i>
      <span class="text-[10px] font-bold">Tasks</span>
    </button>
    <button id="mob-tab-profile" class="flex flex-col items-center gap-1 text-slate-400 hover:text-black transition-all active:scale-95">
      <div class="w-6 h-6 bg-slate-200 rounded-full flex items-center justify-center border border-slate-300 overflow-hidden" id="mob-avatar-container">
        <i data-lucide="user" class="w-4 h-4 text-slate-500"></i>
      </div>
      <span class="text-[10px] font-bold">Profile</span>
    </button>
  </nav>

  <!-- Modals Container -->
  <div id="modals-container"></div>

  <!-- Smart Tooltip Container -->
  <div id="smart-tooltip" class="fixed z-[9999] hidden max-w-sm bg-white p-4 rounded-2xl shadow-2xl border border-slate-100 transition-opacity opacity-0 pointer-events-none transform translate-y-2"></div>

  <!-- Templates -->
  <template id="tpl-login">
    <div class="min-h-[80vh] flex items-center justify-center">
      <div class="w-full max-w-sm space-y-8">
        <div class="text-center flex flex-col items-center mb-8">
          <img src="images/playbook-logo.png" alt="Playbook" class="h-16 w-auto mix-blend-multiply mb-6" style="object-fit: contain;">
          <h2 class="text-3xl font-bold tracking-tight text-slate-900">Welcome</h2>
          <p class="mt-2 text-sm text-slate-500">Sign in to your portal</p>
        </div>
        <form id="form-login" class="space-y-6 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <div id="login-error" class="bg-red-50 text-red-500 p-4 rounded-2xl text-sm hidden"></div>
          <div class="space-y-4">
            <input type="email" id="login-email" required class="input-field bg-slate-50 border-none" placeholder="Email address">
            <input type="password" id="login-password" required class="input-field bg-slate-50 border-none" placeholder="Password">
          </div>
          <button type="submit" id="btn-login-submit" class="btn-primary">Sign in</button>
        </form>
        <p class="text-center text-sm text-slate-500">
          Don't have an account? <a href="#register" class="font-semibold text-slate-900 hover:underline">Register here</a>
        </p>
      </div>
    </div>
  </template>

  <template id="tpl-register">
    <div class="min-h-[80vh] flex items-center justify-center">
      <div class="w-full max-w-sm space-y-8">
        <div class="text-center flex flex-col items-center mb-8">
          <img src="images/playbook-logo.png" alt="Playbook" class="h-16 w-auto mix-blend-multiply mb-6" style="object-fit: contain;">
          <h2 class="text-3xl font-bold tracking-tight text-slate-900">Create Account</h2>
          <p class="mt-2 text-sm text-slate-500">Join the student portal</p>
        </div>
        <form id="form-register" class="space-y-6 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <div id="register-error" class="bg-red-50 text-red-500 p-4 rounded-2xl text-sm hidden"></div>
          <div class="space-y-4">
            <input type="text" id="reg-name" required class="input-field bg-slate-50 border-none" placeholder="Full Name">
            <input type="text" id="reg-number" class="input-field bg-slate-50 border-none" placeholder="Registration Number (Optional)">
            <input type="email" id="reg-email" required class="input-field bg-slate-50 border-none" placeholder="Email address">
            <input type="password" id="reg-password" required class="input-field bg-slate-50 border-none" placeholder="Password">
          </div>
          <button type="submit" id="btn-register-submit" class="btn-primary">Create account</button>
        </form>
        <p class="text-center text-sm text-slate-500">
          Already have an account? <a href="#login" class="font-semibold text-slate-900 hover:underline">Sign in</a>
        </p>
      </div>
    </div>
  </template>

  <template id="tpl-course">
    <div class="space-y-8 max-w-3xl mx-auto">
      <a href="#" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-900 transition-colors mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
      </a>
      <h2 id="course-title" class="text-3xl font-bold text-slate-900 mb-8">Course Name</h2>

      <section id="course-materials-section" class="hidden">
        <div class="flex justify-between items-end mb-4">
          <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="file-text" class="text-blue-500 w-5 h-5"></i> Course Materials
          </h3>
          <button id="btn-yt-tutorials" class="flex items-center gap-2 text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200 transition-all">
            <i data-lucide="youtube" class="w-4 h-4"></i> Tutorials
          </button>
        </div>
        <div id="course-materials-list" class="grid gap-4 sm:grid-cols-2"></div>
      </section>

      <section id="course-pending-section" class="hidden">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="clock" class="text-amber-500 w-5 h-5"></i> Pending Assignments
          </h3>
          <button id="btn-sync-calendar-course" class="hidden flex items-center gap-2 text-xs font-bold text-slate-500 bg-slate-50 hover:bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 transition-all">
            <i data-lucide="calendar" class="w-4 h-4"></i> Sync to Calendar
          </button>
        </div>
        <div id="course-pending-list" class="space-y-4"></div>
      </section>

      <section id="course-graded-section" class="hidden">
        <h3 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i data-lucide="check-circle" class="text-emerald-500 w-5 h-5"></i> Past Submissions & Grades
        </h3>
        <div id="course-graded-list" class="space-y-4"></div>
      </section>
    </div>
  </template>

  <template id="tpl-dashboard">
    <div class="fade-in">

      <!-- Daily Motivation Widget -->
      <div class="mb-8 bg-gradient-to-r from-purple-500 to-indigo-600 rounded-3xl p-6 shadow-lg shadow-indigo-200 text-white relative overflow-hidden group">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white opacity-10 rounded-full blur-2xl group-hover:scale-110 transition-transform duration-700"></div>
        <h2 class="text-sm font-bold uppercase tracking-widest text-indigo-100 mb-2 flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4"></i> Daily Insight</h2>
        <p id="daily-motivation" class="text-lg font-medium leading-tight">"Loading inspiration..."</p>
      </div>

      <!-- Top Action Bar -->
      <div class="flex justify-between items-center mb-6 px-1">
        <h2 class="text-3xl font-bold tracking-tight text-slate-900">My Classes</h2>
        <button id="btn-open-join" class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center hover:scale-105 transition-transform shadow-lg">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Horizontal scrolling Class List (Airbnb style categories) -->
      <div class="mb-10 overflow-x-auto pb-6 hide-scrollbar px-1">
        <div id="classes-list" class="flex gap-4 snap-x"></div>
      </div>

      <!-- Chart.js Trend Visualizer (Hidden if no grades) -->
      <section id="analytics-section" class="card hidden mb-10">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="bar-chart-2" class="text-slate-900 w-5 h-5"></i> Performance
          </h2>
        </div>
        <div class="w-full h-40">
          <canvas id="grade-chart"></canvas>
        </div>
      </section>

      <!-- Native Interactive Calendar UI -->
      <section id="mini-calendar-section" class="card mb-10 hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="calendar-days" class="text-slate-900 w-5 h-5"></i> Upcoming Deadlines
          </h2>
          <p id="cal-month-year" class="text-sm font-bold text-slate-500 uppercase tracking-widest"></p>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center mb-2">
          <span class="text-xs font-bold text-slate-400">Su</span>
          <span class="text-xs font-bold text-slate-400">Mo</span>
          <span class="text-xs font-bold text-slate-400">Tu</span>
          <span class="text-xs font-bold text-slate-400">We</span>
          <span class="text-xs font-bold text-slate-400">Th</span>
          <span class="text-xs font-bold text-slate-400">Fr</span>
          <span class="text-xs font-bold text-slate-400">Sa</span>
        </div>
        <div id="mini-calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </section>

      <!-- Task Filters (Airbnb style pills) -->
      <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-2">
        <div class="flex gap-2">
          <button id="filter-todo" class="px-4 py-2 text-sm font-bold border-b-2 border-slate-900 text-slate-900 transition-all">To Do</button>
          <button id="filter-done" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-900 transition-all">Completed</button>
        </div>
        <button id="btn-sync-calendar" class="hidden flex items-center gap-2 text-xs font-bold text-slate-500 bg-slate-50 hover:bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 transition-all">
          <i data-lucide="calendar" class="w-4 h-4"></i> Sync to Calendar
        </button>
      </div>

      <!-- Task Lists Container -->
      <div id="tasks-container" class="space-y-3">
        <!-- Javascript will render lists here based on active filter -->
        <div id="pending-list"></div>
        <div id="graded-list" class="hidden"></div>
      </div>

    </div>
  </template>

  <template id="tpl-join-modal">
    <div id="join-modal-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
      <div class="w-full max-w-sm bg-white rounded-[24px] shadow-xl overflow-hidden">
        <div class="flex justify-between items-center p-6 pb-4 border-b border-slate-50">
          <h3 class="text-xl font-bold text-slate-900">Join a Class</h3>
          <button id="btn-close-join" class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-50">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <form id="form-join" class="p-6 space-y-6">
          <div id="join-error" class="bg-red-50 text-red-500 p-4 rounded-[16px] text-sm hidden"></div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Class Code</label>
            <input type="text" id="join-code" required maxlength="6" class="input-field text-center tracking-[0.2em] font-mono font-bold uppercase" placeholder="e.g. A1B2C3">
          </div>
          <button type="submit" id="btn-join-submit" class="btn-primary">Join Class</button>
        </form>
      </div>
    </div>
  </template>

  <template id="tpl-assignment">
    <div class="space-y-8">
      <button onclick="window.location.hash=''" class="flex items-center gap-2 text-slate-500 hover:text-slate-900">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
      </button>

      <div id="assignment-header"></div>

      <div class="card">
        <h2 class="text-lg font-bold text-slate-900 mb-2">Instructions</h2>
        <p id="assignment-desc" class="text-slate-600 whitespace-pre-wrap"></p>
      </div>

      <div>
        <h2 class="text-2xl font-bold text-slate-900 mb-6">Submit Your Work</h2>

        <div class="card p-2 flex mb-6 shadow-sm gap-2">
          <button id="tab-text" class="flex-1 py-3 px-4 rounded-[20px] text-sm font-semibold flex items-center justify-center gap-2 bg-slate-100 text-slate-800 transition-colors">
            <i data-lucide="file-text" class="w-4 h-4"></i> Write Online
          </button>
          <button id="tab-pdf" class="flex-1 py-3 px-4 rounded-[20px] text-sm font-semibold flex items-center justify-center gap-2 text-slate-500 hover:bg-slate-50 transition-colors">
            <i data-lucide="upload" class="w-4 h-4"></i> Upload PDF
          </button>
        </div>

        <form id="form-submit-work" class="space-y-6">
          <div id="submit-error" class="bg-red-50 text-red-500 p-4 rounded-[16px] text-sm hidden"></div>

          <div id="container-text" class="card p-0 overflow-hidden relative pb-12">
            <!-- Quill Editor Container -->
            <div id="submit-editor" class="h-64 outline-none border-none text-base text-slate-900"></div>
            <!-- Hidden textarea to store the value for validation. Removed required attribute to fix submission bug. -->
            <textarea id="submit-text" class="hidden"></textarea>
            <div id="grammar-check-banner" class="hidden absolute bottom-0 left-0 w-full bg-slate-50 border-t border-slate-200 p-3 flex justify-between items-center shadow-inner z-10">
              <div class="flex items-center gap-2 truncate mr-4">
                <div class="text-xs font-black tracking-wider flex items-center gap-1.5 text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500 shrink-0">
                  <i data-lucide="sparkles" class="w-4 h-4 text-purple-500"></i>
                </div>
                <p id="grammar-suggestion" class="text-sm font-bold text-slate-700 truncate">Playbook AI</p>
              </div>
              <button type="button" id="btn-dismiss-grammar" class="text-slate-400 hover:text-slate-900 transition-colors p-1 bg-slate-200 rounded-full shrink-0">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div id="container-pdf" class="hidden card border-2 border-dashed border-slate-200 text-center hover:border-slate-500 cursor-pointer relative">
            <input type="file" id="submit-pdf" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="upload" class="text-slate-600 w-8 h-8"></i>
            </div>
            <h3 id="pdf-name" class="text-lg font-bold text-slate-900 mb-1">Select PDF to upload</h3>
            <p class="text-slate-500 text-sm">Tap to browse files (PDF only)</p>
          </div>

          <button type="submit" id="btn-submit-work" class="btn-primary">Submit Work</button>
        </form>
      </div>
    </div>
  </template>

  <template id="tpl-success">
    <div class="card text-center py-12">
      <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-lucide="check-circle" class="text-green-500 w-12 h-12"></i>
      </div>
      <h2 class="text-3xl font-bold text-slate-900 mb-4">Submission Secured</h2>
      <p class="text-slate-500 mb-8 text-lg">Awaiting Professor's Review. You will be notified once graded.</p>
      <button onclick="window.location.hash=''" class="btn-primary">Return to Dashboard</button>
    </div>
  </template>

  <template id="tpl-grade-review">
    <div class="space-y-6 fade-in">
      <header class="flex items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
        <button onclick="window.location.hash=''" class="p-2 text-slate-400 hover:text-slate-900 rounded-full hover:bg-slate-50 transition-colors">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <div class="flex-1">
          <p id="grade-course-name" class="text-xs font-bold text-slate-400 uppercase tracking-widest"></p>
          <h1 id="grade-title" class="text-xl font-bold text-slate-900"></h1>
        </div>
        <div class="bg-slate-100 text-slate-900 px-4 py-2 rounded-xl font-bold text-lg">
          <span id="grade-score"></span>
        </div>
      </header>

      <div class="text-center py-6 mb-4">
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Evaluation Complete</h2>
        <p class="text-slate-500 font-medium text-sm">Review your feedback below.</p>
      </div>

      <div id="feedback-list" class="space-y-6"></div>

      <!-- Exam-Level Appeal Button -->
      <div class="mt-10 mb-8 border-t border-slate-200 pt-8" id="exam-appeal-container">
        <button id="btn-open-exam-appeal" class="w-full md:w-auto mx-auto flex items-center justify-center gap-2 px-6 py-3 bg-white border-2 border-slate-200 text-slate-500 hover:text-black hover:border-black rounded-2xl font-bold text-sm transition-all shadow-sm">
          <i data-lucide="flag" class="w-4 h-4"></i> Dispute Entire Exam
        </button>
      </div>
    </div>
  </template>

</body>
</html>
